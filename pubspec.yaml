name: replai
description: "Replai - AI-powered email reply assistant with on-device LLM via IMAP/SMTP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  llama_flutter_android: ^0.2.0

  enough_mail: ^2.1.7
  mailer: ^7.1.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  webview_flutter: ^4.10.0
  flutter_widget_from_html: ^0.15.2

  intl: ^0.20.2
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  equatable: ^2.0.7
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/replai.png

flutter_launcher_icons:
  android: true
  image_path: "assets/replai.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/replai.png"
